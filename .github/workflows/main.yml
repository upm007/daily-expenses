name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk DailyExpenses.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: DailyExpenses-apk
          path: DailyExpenses.apk

      - name: Publish a download link (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Daily Expenses (build ${{ github.run_number }})
          body: Download DailyExpenses.apk below and open it on your Android phone to install.
          files: DailyExpenses.apk
