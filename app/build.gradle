plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dailyexpenses.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dailyexpenses.app'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '3.1'
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'dailyexp123'
            keyAlias 'dailyexp'
            keyPassword 'dailyexp123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
